name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  psp-build:
    name: PSP Target Build (PSPSDK)
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile PSP EBOOT.PBP
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Step 1: Environment Diagnostics ==="
          echo "PSPDEV=${PSPDEV:-unset}"
          which psp-config
          psp-config --pspdev-path
          psp-config --pspsdk-path
          ls -la "$(psp-config --pspsdk-path)/lib/build.mak"
          psp-gcc --version | head -1
          echo "======================================="
          test -f "$(psp-config --pspsdk-path)/lib/build.mak"
          make -j$(nproc) 2>&1 | tee build_psp.log
          test -s EBOOT.PBP && ls -la EBOOT.PBP hcr.elf && sha256sum EBOOT.PBP hcr.elf

      - name: Upload PSP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hcr-psp-eboot
          if-no-files-found: error
          path: |
            EBOOT.PBP
            hcr.elf
            build_psp.log

  pc-build:
    name: PC Target Build (Linux / SDL2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev libgl-dev

      - name: Configure and Compile PC Binary
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build-pc -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build-pc -j$(nproc) 2>&1 | tee build_pc.log

      - name: Run Determinism & Verification Tests
        shell: bash
        run: |
          set -euo pipefail
          ./build-pc/test_physics
          ./build-pc/test_aircontrol
          ./build-pc/test_coasting
          ./build-pc/test_air_sensors
          ./build-pc/test_suspension
          ./build-pc/test_items
          ./build-pc/test_terrain
          ./build-pc/test_config
          ./build-pc/test_timestep
          ./build-pc/test_texture
          ./build-pc/test_save
          ./build-pc/test_garage

      - name: Upload PC Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hcr-pc-binary
          if-no-files-found: error
          path: |
            build-pc/hcr_pc
            build_pc.log
